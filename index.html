<title>TikTok Drama Daily Report</title>
<style>
:root {
  color-scheme: light;
  --page: #f5f7fa; --surface: #fff; --surface2: #f7f9fc;
  --ink: #1f1f1f; --ink2: #595959; --muted: #8c8c8c;
  --grid: #f0f0f0; --axis: #d9d9d9; --border: rgba(0,0,0,.08);
  --gold: #1890ff; --gold-dim: #1677c8;
  --s1: #1890ff; --s2: #d48806; --s3: #389e0d;
  --up: #237804; --down: #cf1322;
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 28px 16px 64px; }
.wrap { width: 100%; max-width: none; margin: 0 auto; }
.hdr { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.kicker { color: var(--gold-dim); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; margin-bottom: 6px; }
h1 { font-family: var(--serif); font-size: 30px; font-weight: 500; letter-spacing: .01em; }
.meta { color: var(--muted); font-size: 12px; letter-spacing: .06em; margin: 8px 0 24px; }
.langbtn { background: transparent; border: 1px solid var(--border); color: var(--ink2);
  border-radius: 10px; padding: 5px 14px; cursor: pointer; font: inherit; font-size: 13px;
  white-space: nowrap; margin-top: 4px; }
.langbtn:hover { border-color: var(--gold-dim); color: var(--gold); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; }
.card h2 { color: var(--gold); font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; margin-bottom: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.kpi .lab { color: var(--ink2); font-size: 12px; letter-spacing: .04em; }
.kpi .val { font-family: var(--serif); font-size: 26px; font-weight: 550; margin: 3px 0; color: var(--ink); }
.kpi .sub { font-size: 12px; color: var(--muted); }
.delta-up { color: var(--up); } .delta-down { color: var(--down); }
ul.insights { padding-left: 20px; }
ul.insights li { margin: 6px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
th { color: var(--gold-dim); font-weight: 600; font-size: 11px; letter-spacing: .08em; }
th:first-child, td:first-child { text-align: left; }
.tbl-scroll { overflow-x: auto; }
details { margin-top: 8px; }
summary { color: var(--muted); font-size: 12px; cursor: pointer; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink2); margin-bottom: 6px; }
.legend .chip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.chart { position: relative; }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
svg .dl { fill: var(--ink2); font-size: 11px; font-weight: 600; }
svg .bandlab { fill: var(--gold-dim); font-size: 10px; font-weight: 600; }
#tip { position: fixed; pointer-events: none; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.12);
  display: none; z-index: 9; min-width: 140px; }
#tip .d { color: var(--muted); margin-bottom: 3px; }
#tip .row { display: flex; justify-content: space-between; gap: 12px; }
.foot { color: var(--muted); font-size: 11px; letter-spacing: .05em; margin-top: 28px; }
.datebar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.datechip { background: transparent; border: 1px solid var(--border); color: var(--ink2);
  border-radius: 8px; padding: 2px 10px; cursor: pointer; font: inherit; font-size: 12px; }
.datechip:hover { border-color: var(--gold-dim); }
.datechip.on { color: var(--gold); border-color: var(--gold-dim); font-weight: 600; }
tr.grp { cursor: pointer; }
tr.grp:hover td { background: rgba(24,144,255,.05); }
.arr { color: var(--gold-dim); display: inline-block; width: 12px; }
#dtrendSel, .datesel { background: var(--page); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 10px; font-size: 13px; font-family: inherit;
  letter-spacing: normal; text-transform: none; }
#dtrendSel:focus, .datesel:focus { outline: none; border-color: var(--gold-dim); }
#dtrendSel { max-width:100%;min-width:0; }
.datesel.on { color: var(--gold); border-color: var(--gold-dim); font-weight: 600; }
tr.cut td { color: var(--gold-dim); font-size: 11px; text-align: center; padding: 4px 8px;
  border-top: 1px dashed var(--gold-dim); opacity: .8; }
tr.tail td { background: rgba(24,144,255,.05); opacity: .8; }
.badge { color: var(--gold-dim); border: 1px solid var(--border); border-radius: 8px;
  font-size: 11px; padding: 0 6px; margin-left: 4px; white-space: nowrap; }
tr.sub td { color: var(--ink2); font-size: 12px; background: var(--surface2); }
.subname { padding-left: 22px !important; }
.coverage-grid { display:grid;grid-template-columns:repeat(31,minmax(0,1fr));gap:3px;margin:5px 0 12px; }
.coverage-day { min-width:0;height:16px;padding:0;border:0;border-radius:3px;background:var(--grid);cursor:pointer; }
.coverage-day.ok { background:var(--s3); } .coverage-day.unavailable { background:var(--down);opacity:.6; }
.coverage-day.institution_only { background:var(--s1); }
.coverage-day.unverified { background:var(--s2); }
.coverage-month { color:var(--ink2);font-size:12px; }
.detail-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px;margin:16px 0; }
.detail-panel { background:var(--surface2);border-radius:10px;padding:16px;min-width:0; }
.detail-panel h3 { font-size:14px;font-weight:500;color:var(--ink);margin-bottom:4px; }
.detail-note { color:var(--muted);font-size:12px;margin:6px 0 12px;overflow-wrap:anywhere; }
.detail-empty { color:var(--ink2);padding:18px 0;font-size:13px; }
.detail-bar { margin:12px 0; }
.detail-bar-label { display:flex;justify-content:space-between;gap:10px;color:var(--ink2);font-size:12px; }
.detail-bar-track { margin-top:5px;height:6px;background:var(--grid);border-radius:4px;overflow:hidden; }
.detail-bar-fill { height:100%;border-radius:4px;background:var(--gold); }
#detailTitleSelect,#detailChannelSelect { max-width:100%;min-width:0; }
#detailAccounts td:first-child { min-width:175px; }
.remote-pending > :not(.remote-status) { display:none!important; }
</style>
</head>

      const digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(b=>b.toString(16).padStart(2,'0')).join('');
      if(digest!==spec.sha256){reportReloads.add(name);throw Error('Section checksum mismatch');}
      const packet=decodeReportData(JSON.parse(new TextDecoder().decode(bytes)));
      if(packet.section!==name||!packet.data||Object.keys(packet.data).length!==spec.keys.length
          ||!spec.keys.every(k=>Object.prototype.hasOwnProperty.call(packet.data,k)))throw Error('Invalid section data');
      if(name.startsWith('episode-')){
        const record=packet.data.episodeInsightRecord,id=name.slice(8);
        if(!record||record.id!==id||spec.keys.length!==1)throw Error('Episode source mismatch');
        (DATA.episodeInsights??={})[id]=record;
      }else for(const key of spec.keys)DATA[key]=packet.data[key];
      reportLoaded.add(name);
      reportReloads.delete(name);
    } finally {clearTimeout(timer);reportLoads.delete(name);}
  })();
  reportLoads.set(name,pending);
  return pending;
}
function deferReportSection(name,cardId,draw) {
  if(!DATA._sections?.[name])return false;
  const card=document.getElementById(cardId),zh=LANG==='zh';
  if(reportLoaded.has(name)){
    reportObservers.get(name)?.disconnect();card.classList.remove('remote-pending');
    card.querySelector('.remote-status')?.remove();return false;
  }
  card.style.display='';card.classList.add('remote-pending');
  let status=card.querySelector('.remote-status');
  if(!status){status=document.createElement('div');status.className='remote-status';status.setAttribute('role','status');card.prepend(status);}
  const labels={details:zh?'单剧画像与分集':'Title audience and episodes',archive:zh?'单剧历史细数据':'Title history'};
  const show=(state)=>{
    status.replaceChildren();
    const text=document.createElement('p');text.className='meta';
    text.textContent=(labels[name]||(zh?'分集运营与逐秒曲线':'Episode operations and second curves'))+' · '+(state==='loading'?(zh?'正在加载…':'Loading…'):state==='failed'?(zh?'加载失败，请重试。':'Loading failed. Please retry.'):(zh?'浏览到这里时加载明细':'Details load when this section is visible'));
    status.append(text);
    const button=document.createElement('button');button.className='datechip';button.disabled=state==='loading';
    button.textContent=state==='failed'?(zh?'重新加载':'Retry'):(zh?'加载明细':'Load details');
    button.onclick=run;status.append(button);
  };
  const run=async()=>{
    reportObservers.get(name)?.disconnect();show('loading');
    try{await loadReportSection(name);card.classList.remove('remote-pending');status.remove();draw();}
    catch(e){show('failed');}
  };
  if(!reportObservers.has(name)){
    show('idle');
    if('IntersectionObserver' in window){
      const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))run();},{rootMargin:'100px'});
      reportObservers.set(name,observer);observer.observe(card);
    }else reportObservers.set(name,{disconnect(){}});
  }else if(!reportLoads.has(name)&&!status.querySelector('button')?.disabled)show('idle');
  return true;
}

const estW = t => { let w = 0; for (const c of String(t)) w += c.charCodeAt(0) > 255 ? 10 : 6; return w; };

/* ---- tiny SVG line chart with crosshair + tooltip ---- */
const tip = document.getElementById('tip');
// bands: [{from, to, label, short, note}] —— 缺采区间。单日轴上不放假点（该空还空）。
// 标签防叠字：完整标签装得进带宽才画，装不下退化成短标签（只写合计），再装不下只留
// 阴影带和"缺采"小标——完整数值悬停 tooltip（note）里始终有，不丢信息。
function lineChart(el, labels, series, yfmt, bands, xformat=d=>d.slice(5)) {
  const W = el.clientWidth || 1040, H = 260,
        P = {l: 60, r: 74, t: 10, b: 24},
        iw = W - P.l - P.r, ih = H - P.t - P.b;
  // null = 该日无实测（平台合并下发，拿不到单日切分）。实线只连实测点；
  // s.est（可选）：与 values 等长的估算值数组（合并区间日均），只在 values 为 null 处生效。
  // 估算段画虚线 + 半透明，与实测实线明确区分；tooltip 标 ≈日均。
  const vals = series.flatMap(s => s.values.concat(s.est || [])).filter(v => v != null);
  const vmax = Math.max(...vals, 0) * 1.08 || 1;
  const vmin = Math.min(...vals, 0);        // 快照差值可为负（平台下修），刻度须容纳
  const span = vmax - vmin || 1;
  const x = i => P.l + iw * (labels.length === 1 ? .5 : i / (labels.length - 1));
  const y = v => P.t + ih * (1 - (v - vmin) / span);
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  for (let i = 0; i <= 4; i++) {
    const gy = P.t + ih * i / 4;
    g += `<line x1="${P.l}" y1="${gy}" x2="${W-P.r}" y2="${gy}" stroke="var(--grid)"/>`;
    g += `<text x="${P.l-6}" y="${gy+4}" text-anchor="end">${yfmt(vmax - span * i / 4)}</text>`;
  }
  const step = Math.ceil(labels.length / 7);
  labels.forEach((d, i) => { if (i % step === 0)
    g += `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${xformat(d)}</text>`; });
  // 缺采带：画在网格之上、折线之下，覆盖整段留空的列（向两侧各让半格，正好卡在相邻实点之间）
  const half = labels.length > 1 ? iw / (labels.length - 1) / 2 : iw / 2;
  (bands || []).forEach((b, bi) => {
    const i0 = labels.indexOf(b.from), i1 = labels.indexOf(b.to);
    if (i0 < 0 || i1 < 0) return;
    const xa = Math.max(P.l, x(i0) - half), xb = Math.min(W - P.r, x(i1) + half);
    g += `<rect x="${xa}" y="${P.t}" width="${Math.max(1, xb-xa)}" height="${ih}" fill="var(--gold-dim)" opacity=".10"/>`;
    [xa, xb].forEach(xx => { g += `<line x1="${xx}" y1="${P.t}" x2="${xx}" y2="${P.t+ih}" stroke="var(--gold-dim)" stroke-dasharray="2 3" opacity=".55"/>`; });
    const bw = xb - xa, cx = (xa + xb) / 2;
    if (estW(T().gapTag) <= bw + 4)
      g += `<text class="bandlab" x="${cx}" y="${P.t+12}" text-anchor="middle">${T().gapTag}</text>`;
    // 允许标签比带宽略宽（一格半以内），但相邻带按奇偶上下错行，避免连成一串
    const lab = b.label && estW(b.label) <= bw + 6 ? b.label
              : b.short && estW(b.short) <= bw + half ? b.short : null;
    if (lab)
      g += `<text class="bandlab" x="${cx}" y="${P.t + (bi % 2 ? 38 : 25)}" text-anchor="middle">${lab}</text>`;
  });
  series.forEach(s => {
    // 遇 null 断线：切成多段各自成 path，缺采处自然留空
    // 实测点连实线；有估算值的地方用虚线把断口接上（任一端是估算值 → 该段虚线）
    const est = s.est || [], full = s.values.map((v, i) => v == null ? est[i] : v), isEst = i => s.values[i] == null;
    let seg = [], dashed = null;
    const flush = () => {
      if (seg.length > 1)
        g += `<path d="M${seg.join('L')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"`
           + (dashed ? ` stroke-dasharray="5 4" opacity=".6"` : '') + `/>`;
      else if (seg.length === 1 && !dashed)   // 孤立单点（两侧都缺采）否则画不出来
        g += `<circle cx="${seg[0].split(',')[0]}" cy="${seg[0].split(',')[1]}" r="2.5" fill="${s.color}"/>`;
      seg = [];
    };
    full.forEach((v, i) => {
      if (v == null) { flush(); dashed = null; return; }
      const pt = `${x(i)},${y(v)}`;
      if (seg.length) {
        const d = isEst(i) || isEst(i - 1);
        if (dashed !== null && d !== dashed) { const last = seg[seg.length - 1]; flush(); seg = [last]; }
        dashed = d;
      }
      seg.push(pt);
    });
    flush();
    const li = s.values.reduce((a, v, i) => v == null ? a : i, -1);   // 最后一个有值的点
    if (li >= 0) {
      g += `<circle cx="${x(li)}" cy="${y(s.values[li])}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
      g += `<text class="dl" x="${x(li)+7}" y="${y(s.values[li])+4}">${s.name}</text>`;
    }
  });
  g += `<line id="xh" x1="0" y1="${P.t}" x2="0" y2="${P.t+ih}" stroke="var(--axis)" stroke-dasharray="3 3" visibility="hidden"/>`;
  g += `<rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  el.innerHTML = g;
  const svg = el.querySelector('svg'), xh = el.querySelector('#xh');
  svg.addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect(), sx = W / r.width;
    const px = (e.clientX - r.left) * sx;
    const i = Math.max(0, Math.min(labels.length-1, Math.round((px - P.l) / iw * (labels.length-1))));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 180) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
    const bd = (bands || []).find(b => {
      const a = labels.indexOf(b.from), z = labels.indexOf(b.to);
      return a >= 0 && z >= 0 && i >= a && i <= z;
    });
    tip.innerHTML = `<div class="d">${labels[i]}${bd ? ' · ' + T().gapTag : ''}</div>`
      + (bd && bd.note ? `<div style="max-width:260px;white-space:normal;line-height:1.5;margin-bottom:4px">${bd.note}</div>` : '')
      + series.map(s =>
      `<div class="row"><span><span class="chip" style="background:${s.color};display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px"></span>${s.name}</span><b>${s.values[i] != null ? yfmt(s.values[i], true) : (s.est && s.est[i] != null) ? '≈ ' + yfmt(s.est[i], true) + ` <span style="opacity:.6;font-weight:400">${T().avgDay}</span>` : '—'}</b></div>`).join('');
  });
  svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); });
}

let periodSelection = 0, customPeriod = null, analysisWindow = null, analysisUnavailable = false, historyRequest=0;
function unavailableChart(id) {
  document.getElementById(id).innerHTML = `<p class="meta">${LANG === 'zh' ? '所选日期缺少完整实测记录，暂无可展示的分析结果。' : 'Complete measurements are unavailable for the selected dates.'}</p>`;
}
const shiftDay = (d,n) => {const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);};
function historyPeriod(start,end) {
  const axis=[];for(let d=start;d<=end;d=shiftDay(d,1))axis.push(d);
  const missing=axis.filter(d=>!Object.prototype.hasOwnProperty.call(DATA.dayDetails,d));
  if(missing.length)return {missing};
  const aggregate = dates => {
    const groups=new Map();
    for(const day of dates) for(const [id,qv,like,fav,com] of DATA.dayDetails[day]) {
      const info=DATA.titleCatalog[id],key=DATA.groupMap[id]||id;
      if(!groups.has(key))groups.set(key,{id:key,name:key===id?info.name:key,qv:0,like:0,fav:0,com:0,launch:null,ids:new Set()});
      const r=groups.get(key);r.qv+=qv;r.like+=like;r.fav+=fav;r.com+=com;r.ids.add(id);
      if(info.launch&&(!r.launch||info.launch>r.launch))r.launch=info.launch;
    }return [...groups.values()];
  };
  const rows=aggregate(axis),total=rows.reduce((s,r)=>s+r.qv,0),previousAxis=axis.map(d=>shiftDay(d,-axis.length));
  const previousComplete=previousAxis.every(d=>Object.prototype.hasOwnProperty.call(DATA.dayDetails,d));
  const previousRows=previousComplete?aggregate(previousAxis):[],prev=new Map(previousRows.map(r=>[r.id,r]));
  for(const r of rows) {
    const p=prev.get(r.id),same=!!p&&r.ids.size===p.ids.size&&[...r.ids].every(id=>p.ids.has(id));
    r.change=same&&p.qv>0?(r.qv-p.qv)/p.qv:null;r.comparisonCoverage=same;
    r.share=total>0?r.qv/total:null;r.fav1k=r.qv>0?r.fav*1000/r.qv:null;
    r.interactions1k=r.qv>0?(r.like+r.fav+r.com)*1000/r.qv:null;
    r.new14=!!r.launch&&r.launch>=shiftDay(end,-13)&&r.launch<=end;
  }
  rows.sort((a,b)=>b.qv-a.qv);
  return {n:axis.length,start,end,rows,total,previous:previousComplete?previousRows.reduce((s,r)=>s+r.qv,0):null,
    label:'自定义区间 · 单日实测汇总',label_en:'Custom range · Sum of measured days'};
}

/* per-drama daily growth trend: one drama at a time, dropdown to switch */
function renderDtrend() {
  if(analysisUnavailable){unavailableChart('dtrend');document.getElementById('dtrendNote').textContent='';return;}
  const DT = DATA.dramaTrends || {};
  if (!Object.keys(DT).length) return;
  document.getElementById('dtrendCard').style.display = '';
  const sel = document.getElementById('dtrendSel');
  // 下拉顺序 = 累计合格播放降序（与 Top10 柱图一致），确保都有趋势数据
  const names = (DATA.schema === 2 ? DATA.trendTitles : DATA.dramas).map(d => ({key: DATA.schema === 2 ? d.id : d.name, name: d.name})).filter(n => DT[n.key] && DT[n.key].length);
  if (!dtrendPick || !names.some(n => n.key === dtrendPick)) dtrendPick = names[0]?.key;
  sel.innerHTML = names.map(n => `<option value="${esc(n.key)}"${n.key === dtrendPick ? ' selected' : ''}>${esc(n.name)}</option>`).join('');
  const dshift = (d, k) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + k); return t.toISOString().slice(0, 10); };
  const drawTrend = () => {
    const pts = analysisWindow ? (DT[dtrendPick] || []).filter(p=>p.d>=analysisWindow.start&&p.d<=analysisWindow.end) : (DT[dtrendPick] || []).slice(-30);
    // 多天合并区间（平台跳更/半刷新）：实测 values 留空（不造单日点），
    // 日均走 est 通道以虚线呈现（BI 惯例：估算/插补值虚线标注），合计写在阴影带和 tooltip 里。
    const axis = [];
    if (pts.length) {
      const from = analysisWindow ? analysisWindow.start : dshift(pts[0].d, -(pts[0].days - 1)), to = analysisWindow ? analysisWindow.end : pts[pts.length-1].d;
      for (let d = from; d <= to; d = dshift(d, 1)) axis.push(d);
    }
    const val = new Map(pts.filter(p => p.days === 1).map(p => [p.d, p]));
    const gaps = pts.filter(p => p.days > 1);
    // 每个合并区间给一条缺采带：范围 = 被留空的那几天（含该档截止日本身，
    // 因为它的量和前面几天粘在一起，同样拆不出单日值）
    const bands = gaps.map(p => {
      const miss = [];
      for (let k = p.days - 1; k >= 0; k--) miss.push(dshift(p.d, -k));
      return {from: miss[0], to: miss[miss.length - 1],
              label: T().bandLabel(p.days, fmtN(p.qv), fmtN(p.qv / p.days)),
              short: T().bandShort(fmtN(p.qv)),
              note: T().bandNote(miss[0].slice(5), miss[miss.length-1].slice(5), p.days, fmtN(p.qv))};
    });
    // 合并区间内的估算值 = 该档合计 / 天数，走 est 通道（虚线），与实测 values 分开
    const estOf = key => { const m = new Map(); gaps.forEach(p => { for (let k = p.days - 1; k >= 0; k--) m.set(dshift(p.d, -k), p[key] / p.days); }); return axis.map(d => m.has(d) ? m.get(d) : null); };
    lineChart(document.getElementById('dtrend'), axis,
      [{name: T().sQVplus, color: 'var(--s2)', values: axis.map(d => val.has(d) ? val.get(d).qv : null), est: estOf('qv')}],
      v => fmtN(v), bands);
    document.getElementById('dtrendNote').innerHTML = bands.length
      ? T().dtrendNote + ' ' + bands.map(b => `${b.from.slice(5)}~${b.to.slice(5)}`).join('、')
      : '';
  };
  sel.onchange = () => { dtrendPick = sel.value; drawTrend(); };
  drawTrend();
}

/* full drama table: sortable headers, default = launch date desc; grouped rows expand */
function renderDramaTbl() {
  const cells = d => `<td>${d.launch || '-'}</td>${DATA.schema === 2 ? `<td>${fmtN(d.episodes)}</td>` : ''}<td>${fmtN(d.qv)}</td><td>${d.dur == null ? '—' : d.dur}</td>
    <td>${fmtN(d.like)}</td><td>${fmtN(d.fav)}</td><td>${fmtN(d.com)}</td>
    <td>${fmtP(d.engage, 2)}</td><td>${d.fav1k == null ? '-' : d.fav1k.toFixed(1)}</td>`;
  const DCOLS = ['name', 'launch', ...(DATA.schema === 2 ? ['episodes'] : []), 'qv', 'dur', 'like', 'fav', 'com', 'engage', 'fav1k'];
  const list = [...DATA.dramas].sort((a, b) => {
    const va = a[dSortK], vb = b[dSortK];
    const n = (va == null) - (vb == null);   // 空值永远垫底，不随排序方向翻到顶部
    if (n) return n;
    const c = (va > vb) - (va < vb);
    return dSortDesc ? -c : c;
  });
  document.getElementById('dramaTbl').innerHTML =
    '<table><tr><th>#</th>' + DCOLS.map(k =>
      `<th class="sortable" data-k="${k}" style="cursor:pointer;white-space:nowrap">${k === 'episodes' ? (LANG === 'zh' ? '集数' : 'Episodes') : T().dcols[k]}${
        k === dSortK ? (dSortDesc ? ' ▼' : ' ▲') : ''}</th>`).join('') + '</tr>' +
    list.map((d, i) => {
      const n = d.members ? d.members.length : 0;
      const isOpen = n && openGrp.has(d.name);
      let rows = `<tr${n ? ` class="grp" data-g="${i}"` : ''}><td>${i+1}</td>
        <td>${n ? `<span class="arr" id="arr${i}">${isOpen ? '▾' : '▸'}</span> ` : ''}${esc(d.name)}${n ? ` <span class="badge">${T().versions(n)}</span>` : ''}</td>${cells(d)}</tr>`;
      if (n) rows += d.members.map(m =>
        `<tr class="sub sub${i}" style="display:${isOpen ? '' : 'none'}"><td></td><td class="subname">└ ${esc(m.name)}</td>${cells(m)}</tr>`).join('');
      return rows;
    }).join('') + '</table>';
  document.querySelectorAll('tr.grp').forEach(tr => tr.addEventListener('click', () => {
    const g = tr.dataset.g, arr = document.getElementById('arr' + g);
    const open = arr.textContent === '▾';
    arr.textContent = open ? '▸' : '▾';
    const name = list[+g].name;
    if (open) openGrp.delete(name); else openGrp.add(name);
    document.querySelectorAll('.sub' + g).forEach(r => r.style.display = open ? 'none' : '');
  }));
  document.querySelectorAll('#dramaTbl th.sortable').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.k;
    dSortDesc = k === dSortK ? !dSortDesc : true;
    dSortK = k;
    renderDramaTbl();
  }));
}

    const observed=axis.filter(d=>Object.prototype.hasOwnProperty.call(points,d)).length;
    document.getElementById('seriesArchiveNote').textContent=zh
      ? `${start.value} ~ ${end.value} · 实际返回 ${observed}/${axis.length} 个日值 · 该剧全档播放与机构单日重合核对 ${source.matchedDays} 点，全档差异 ${(source.differences||[]).length} 点（不代表时长已核对）。此处按单个剧目/版本展示，不计入全机构已验收覆盖；未返回日期留空，互动指标不从本曲线推导。`
      : `${start.value} ~ ${end.value} · ${observed}/${axis.length} daily values returned · Across all archived dates for this title: ${source.matchedDays} overlapping view points checked; ${(source.differences||[]).length} differences (not a duration check). This is a separate title/version source, not institution-wide verified coverage. Missing dates stay blank; interactions are not inferred.`;
    if(!observed){unavailableChart('seriesArchivePlot');clearDataTable('seriesArchiveData');return;}
    const label=seriesArchiveMetric==='qv'?(zh?'有效播放':'Effective views'):(zh?'平均播放时长（秒）':'Average play duration (seconds)');
    const series=[{name:label,color:'var(--s1)',values:axis.map(d=>Object.prototype.hasOwnProperty.call(points,d)?points[d]:null)}];
    const format=v=>seriesArchiveMetric==='qv'?fmtN(v):(v==null?'-':Number(v).toFixed(2)+'s');
    lineChart(document.getElementById('seriesArchivePlot'),axis,series,format);
    dataTable('seriesArchiveData',axis,series,format);
  };
  pick.onchange=()=>{seriesArchivePick=pick.value;seriesArchiveWindow=null;renderSeriesArchive();};
  metric.onchange=()=>{seriesArchiveMetric=metric.value;draw();};
  document.getElementById('seriesArchiveApply').onclick=draw;
  draw();
}

let episodeOpsPick=null,episodeOpsItem=null,episodeOpsSort='episode';
function renderEpisodeOps() {
  const catalog=DATA.episodeInsightCatalog||[];
  if(!catalog.length)return;
  const zh=LANG==='zh',el=id=>document.getElementById(id),pct=v=>v==null?'—':(v*100).toFixed(1)+'%';
  el('episodeOpsJump').style.display='';
  el('episodeOpsJump').textContent=zh?'查看分集、逐秒与引流素材':'View episodes, second curves and promotional materials';
  el('episodeOpsJump').onclick=()=>el('episodeOpsCard').scrollIntoView({block:'start'});
  const sorted=[...catalog].sort((a,b)=>b.curves-a.curves||b.rows-a.rows||a.name.localeCompare(b.name));
  if(!sorted.some(r=>r.id===episodeOpsPick))episodeOpsPick=sorted[0].id;
  el('episodeOpsCard').style.display='';
  if(deferReportSection('episode-'+episodeOpsPick,'episodeOpsCard',renderEpisodeOps))return;
  const record=DATA.episodeInsights?.[episodeOpsPick];
  if(!record)return;
  el('episodeOpsTitle').textContent=zh?'内容运营 · 分集、观看与引流':'Content operations · Episodes, viewing and promotion';
  const select=el('episodeOpsTitleSelect');
  select.setAttribute('aria-label',zh?'选择分集运营剧目':'Choose episode operations title');
  select.innerHTML=sorted.map(r=>`<option value="${esc(r.id)}"${r.id===episodeOpsPick?' selected':''}>${esc(r.name)}</option>`).join('');
  select.onchange=()=>{episodeOpsPick=select.value;episodeOpsItem=null;renderEpisodeOps();};
  const metrics=record.metrics,rows=metrics?.rows||[],seconds=record.seconds||{};
  const videoFor=r=>Object.values(seconds).filter(v=>v.episode===r.episode&&v.highlight===r.highlight&&(v.itemId===r.itemId||(r.itemIds||[]).includes(v.itemId))).sort((a,b)=>b.checked.localeCompare(a.checked))[0];
  const eligible=rows.filter(r=>!r.highlight&&r.episode>0&&r.itemId),covered=eligible.filter(r=>videoFor(r)).length;
  const when=s=>new Date(s).toLocaleString(zh?'zh-CN':'en-US',{hour12:false});
  el('episodeOpsScope').textContent=(metrics?`${metrics.start} ~ ${metrics.end} · ${zh?'采集于':'Observed'} ${when(metrics.checked)} · ${rows.length}/${metrics.total} ${zh?'集/片段已完整翻页':'episodes/highlights, all pages verified'}`:(zh?'平台暂未返回可用的分集指标表':'No usable episode metric table returned'))
    +(zh?'。新增列按此查询区间，累计列保留平台累计；完播率与平均时长为平台原值，不混入主增长榜。曝光与点击的口径尚未核准，不据此计算转化率。':' . Added columns use this query range; cumulative columns retain platform totals. Completion and average duration are separate platform metrics, excluded from primary growth rankings. Exposure/click definitions remain unverified; no conversion rate is inferred.')
    +(metrics?(zh?` 逐秒采集覆盖 ${covered}/${eligible.length} 集的可用视频快照。`:` Second curves cover ${covered}/${eligible.length} episodes with available video snapshots.`):'')
    +(record.lastError?(zh?' 本轮更新失败，保留上述时间的结果。':' Refresh failed; retaining the observation above.'):'')
    +(record.pending?(zh?' 逐秒曲线仍在补采中。':' More second curves are pending collection.'):'');
  const sort=el('episodeOpsSort'),sorts=zh?{episode:'按集号',qv:'按新增有效播放',finishRate:'按平台完播率',durationSeconds:'按平均观看时长'}:{episode:'Episode order',qv:'Effective views added',finishRate:'Platform completion',durationSeconds:'Average duration'};
  sort.innerHTML=Object.entries(sorts).map(([k,v])=>`<option value="${k}"${k===episodeOpsSort?' selected':''}>${v}</option>`).join('');
  sort.onchange=()=>{episodeOpsSort=sort.value;renderEpisodeOps();};
  const value=r=>episodeOpsSort==='qv'?r.added.qv:r[episodeOpsSort];
  const ordered=[...rows].sort((a,b)=>episodeOpsSort==='episode'?Number(a.highlight)-Number(b.highlight)||a.episode-b.episode:(value(b)??-1)-(value(a)??-1)||a.episode-b.episode);
  const labels=zh?['集号','新增有效播放','累计有效播放','平台完播率','平均观看时长','新增点赞','新增收藏','新增评论','逐秒曲线']:['Episode','Effective views +','Cumulative effective','Platform completion','Average duration','Likes +','Favorites +','Comments +','Second curve'];
  const name=r=>r.highlight?(zh?'片段 ':'Highlight ')+r.episode:r.episode===0?(zh?'未编号内容':'Unnumbered content'):(zh?'第 '+r.episode+' 集':'Episode '+r.episode);
  el('episodeOpsTable').innerHTML=rows.length?'<table><thead><tr>'+labels.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>'+ordered.map(r=>`<tr><td>${esc(name(r))}</td><td>${fmtN(r.added.qv)}</td><td>${fmtN(r.cumulative.qv)}</td><td>${pct(r.finishRate)}</td><td>${r.durationSeconds==null?'—':r.durationSeconds.toFixed(2)+' s'}</td><td>${fmtN(r.added.like)}</td><td>${fmtN(r.added.fav)}</td><td>${fmtN(r.added.com)}</td><td>${videoFor(r)?`<button class="datechip" data-insight-item="${esc(videoFor(r).itemId)}">${zh?'查看':'View'}</button>`:'—'}</td></tr>`).join('')+'</tbody></table>':'';
  el('episodeOpsTable').querySelectorAll('[data-insight-item]').forEach(b=>b.onclick=()=>{episodeOpsItem=b.dataset.insightItem;renderEpisodeOps();el('episodeOpsCurveTitle').scrollIntoView({block:'start',behavior:'smooth'});});
  el('episodeOpsMaterialTitle').textContent=zh?'引流素材表现':'Promotional material performance';
  const materials=record.materials;
  el('episodeOpsMaterialNote').textContent=materials?`${zh?'目录已核对':'Catalog verified'} ${materials.rows.length}/${materials.total} · ${materials.start?materials.start+' ~ '+materials.end+' · ':''}${zh?'采集于':'Observed'} ${when(materials.checked)}`
    +(zh?'。曝光和点击保留本源原值；点击/曝光比=点击量÷曝光量，分母为0或缺失时留空，不代表人数转化率。素材不与剧集主榜相加，同名素材按发布视频分行。账号地区不是观众地区；带剧贡献暂无可核对值，不推算或回填。':' . Exposure and clicks retain this source’s values. Click/exposure = clicks / exposures; zero or missing denominators stay blank. It is not a viewer conversion rate. Materials are excluded from primary drama totals; same-named publishing videos remain separate. Account regions are not viewer geography. No drama-play contribution is inferred.')
    +(materials.statsPartial?(zh?' 部分素材统计尚未返回，缺值留空并继续重试。':' Some material statistics remain unavailable and will be retried.'):'')
    +(record.materialError?(zh?' 本轮刷新失败，保留此快照。':' Refresh failed; retaining this snapshot.'):''):(zh?'素材数据尚未取得；后续继续重试，不按0填充。':'Material data is not yet available; it remains eligible for retry and is not filled with zeros.');
  const materialCols=zh?['素材 / 视频','发布账号','账号地区','发布日（UTC）','素材时长','平台曝光','平台点击','点击/曝光比']:['Material / video','Publishing account','Account region','Published (UTC)','Duration','Platform exposure','Platform clicks','Click/exposure'];
  el('episodeOpsMaterials').innerHTML=materials?.rows?.length?'<table><thead><tr>'+materialCols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+[...materials.rows].sort((a,b)=>(b.impressions??-1)-(a.impressions??-1)).map(r=>`<tr><td>${esc(r.title||(zh?'未命名素材':'Untitled material'))}<div class="detail-note">…${esc(r.itemId.slice(-6))}</div></td><td>${esc(r.account.name||r.account.handle||'—')}</td><td>${esc(r.account.region||'—')}</td><td>${r.published||'—'}</td><td>${r.durationSeconds==null?'—':r.durationSeconds.toFixed(1)+' s'}</td><td>${fmtN(r.impressions)}</td><td>${fmtN(r.clicks)}</td><td>${pct(r.impressions>0&&r.clicks!=null?r.clicks/r.impressions:null)}</td></tr>`).join('')+'</tbody></table>':'';
  el('episodeOpsCurveTitle').textContent=zh?'逐秒观看到达与点赞分布 · 单视频快照':'Second-by-second viewing and like distribution · Single-video snapshot';
  const videos=Object.values(seconds).sort((a,b)=>a.episode-b.episode||b.checked.localeCompare(a.checked));
  if(!videos.some(v=>v.itemId===episodeOpsItem))episodeOpsItem=videos[0]?.itemId||null;
  const videoSelect=el('episodeOpsVideo');videoSelect.innerHTML=videos.map(v=>`<option value="${esc(v.itemId)}"${v.itemId===episodeOpsItem?' selected':''}>${esc(name(v))} · ${zh?'视频':'Video'} …${esc(v.itemId.slice(-6))}</option>`).join('');
  videoSelect.setAttribute('aria-label',zh?'选择逐秒视频版本':'Choose second-curve video version');
  videoSelect.onchange=()=>{episodeOpsItem=videoSelect.value;renderEpisodeOps();};
  const video=seconds[episodeOpsItem];
  el('episodeOpsDataLabel').textContent=zh?'查看逐秒原值':'View second-by-second values';
  if(!video){
    el('episodeOpsCurveNote').textContent=zh?'尚未取得可用逐秒曲线。平台可能因播放不足、未发布或数据过期不返回；缺失不按0处理，后续继续重试。':'No usable second curve yet. The platform may withhold it for insufficient plays, unpublished content or expiry. Missing data is not zero and remains eligible for retry.';
    el('episodeOpsKpis').innerHTML='';el('episodeOpsDrops').textContent='';unavailableChart('episodeOpsRetention');unavailableChart('episodeOpsLikes');clearDataTable('episodeOpsData');return;
  }
  el('episodeOpsCurveNote').textContent=(zh?'采集于 ':'Observed ')+when(video.checked)+(zh?'。本曲线仅对应视频 …':' . This curve represents video …')+video.itemId.slice(-6)
    +(zh?'，不代表整集全部发布版本；不随日期筛选切换，平台未提供独立截止日或观众样本量。观看到达率=到达该秒的观众÷总播放观众；点赞分布=该秒点赞数÷总点赞数。分集表完播率与本曲线末值口径不同，不互相替代。':' only, not all publishing versions of this episode. It is independent of date filters; no separate watermark or viewer sample size is supplied. Reach = viewers reaching that second / total play viewers. Like distribution = likes at that second / total likes. Table completion and the curve endpoint have different scopes and are not interchangeable.')
    +(Object.entries(record.failures||{}).some(([id])=>id===video.itemId||rows.some(r=>r.itemId===id&&r.episode===video.episode&&(r.itemIds||[]).includes(video.itemId)))?(zh?' 最近重采失败，保留此快照。':' Latest refresh failed; this snapshot is retained.'):'');
  const retention=new Map(video.retention),likes=new Map(video.likes),points=[...new Set([...retention.keys(),...likes.keys()])].sort((a,b)=>a-b),axis=Array.from({length:Math.max(...points)+1},(_,i)=>i);
  const kpis=[3,5,10].map(t=>({label:zh?t+'秒到达率':t+'s reach',value:pct(retention.has(t)?retention.get(t):null)}));
  el('episodeOpsKpis').innerHTML=kpis.map(k=>`<div class="detail-panel"><div class="meta">${k.label}</div><strong style="font-size:22px">${k.value}</strong></div>`).join('');
  const drops=[...retention].filter(([s,v])=>retention.has(s-1)&&retention.get(s-1)>v).map(([s,v])=>({second:s,pp:(retention.get(s-1)-v)*100})).sort((a,b)=>b.pp-a.pp).slice(0,3);
  const peaks=[...likes].sort((a,b)=>b[1]-a[1]).slice(0,3);
  el('episodeOpsDrops').textContent=(zh?'优先复盘的相邻秒下降：':'Largest adjacent-second drops to review: ')+(drops.length?drops.map(d=>`${d.second-1}→${d.second}s ${d.pp.toFixed(2)}${zh?'个百分点':' pp'}`).join('；'):'—')
    +(zh?'。点赞集中秒点：':' . Like concentration: ')+(peaks.length?peaks.map(([s,v])=>s+'s '+pct(v)).join('；'):'—')+(zh?'。以上为观察线索，不推断流失人数或剧情因果。':' . These are review signals, not estimates of lost viewers or causal claims.');
  const retentionSeries=[{name:zh?'平台逐秒完播率（观看到达）':'Platform completion by second (reach)',color:'var(--s1)',values:axis.map(s=>retention.has(s)?retention.get(s):null)}];
  const likeSeries=[{name:zh?'点赞发生时间分布':'Like timing distribution',color:'var(--s3)',values:axis.map(s=>likes.has(s)?likes.get(s):null)}];
  if(retention.size)lineChart(el('episodeOpsRetention'),axis.map(String),retentionSeries,pct,[],s=>s+'s');else unavailableChart('episodeOpsRetention');
  if(likes.size)lineChart(el('episodeOpsLikes'),axis.map(String),likeSeries,pct,[],s=>s+'s');else unavailableChart('episodeOpsLikes');
  dataTable('episodeOpsData',axis.map(s=>s+'s'),[...retentionSeries,...likeSeries],pct);
}

function renderAll() {
  renderHeader();
  renderModern();
  renderGaps();
  renderInsights();
  renderKpis();
  renderTrendCharts();
  renderWow();
  renderTopBars();
  renderMovers();
  renderDtrend();
  renderDramaTbl();
  renderSeriesDetails();
  renderSeriesArchive();
  renderEpisodeOps();
  document.documentElement.dataset.reportReady='true';
  performance.mark('report-ready');

document.getElementById('langBtn').addEventListener('click', () => {
  historyRequest++;
  LANG = LANG === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('ttdr_lang', LANG); } catch (e) {}
  renderAll();
});
renderHeader();

setTimeout(renderAll,0);
